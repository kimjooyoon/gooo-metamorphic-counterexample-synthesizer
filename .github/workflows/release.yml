name: annotated immutable release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged main commit to release
        required: true
        type: string
      release_version:
        description: New unused 0.x.y version
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: true
          cache: true
      - name: Bind exact merged commit and reject tag reuse
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$RELEASE_VERSION" in 0.*.*) ;; *) exit 64 ;; esac
          TAG="v$RELEASE_VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = "main"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
      - name: Check formatting, vet, build, and test exactly once
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/build.rss" go build -trimpath -o "$RUNNER_TEMP/gooo-synth" ./cmd/gooo-metamorphic-counterexample-synthesizer
          finished=$(date +%s%3N)
          echo "build_wall_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/vet.rss" go vet ./...
          finished=$(date +%s%3N)
          echo "vet_wall_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/test.rss" go test -json -count=1 ./... > "$RUNNER_TEMP/go-test.json"
          finished=$(date +%s%3N)
          echo "test_wall_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
      - name: Run release conformance and synthesis
        id: synthesize
        shell: bash
        run: |
          set -Eeuo pipefail
          runner="$RUNNER_TEMP/gooo-synth"
          export RUNNER_DIGEST="sha256:$(sha256sum "$runner" | awk '{print $1}')"
          export SUBJECT_SHA="$EXPECTED_SHA"
          export TOOLCHAIN_VERSION="$(go env GOVERSION)"
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/conformance.rss" "$runner" conformance \
            --source .gooo/metamorphic-counterexample-synthesizer.gooo \
            --contract contracts/metamorphic-counterexample-synthesizer-v1.json \
            --fixtures fixtures/scenarios.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/conformance.json"
          finished=$(date +%s%3N)
          conformance_wall_ms=$((finished - started))
          echo "conformance_wall_ms=$conformance_wall_ms" >> "$GITHUB_OUTPUT"
          jq -e '.status == "PASS" and .scenario_count == 8 and .activity_count == 7' "$RUNNER_TEMP/conformance.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/synthesis-output"
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/integration.rss" bash scripts/run-synthesis.sh "$GITHUB_WORKSPACE" "$runner" "$RUNNER_TEMP/synthesis-output"
          finished=$(date +%s%3N)
          integration_wall_ms=$((finished - started))
          echo "integration_wall_ms=$integration_wall_ms" >> "$GITHUB_OUTPUT"
          build_rss=$(cat "$RUNNER_TEMP/build.rss")
          vet_rss=$(cat "$RUNNER_TEMP/vet.rss")
          test_rss=$(cat "$RUNNER_TEMP/test.rss")
          conformance_rss=$(cat "$RUNNER_TEMP/conformance.rss")
          integration_rss=$(cat "$RUNNER_TEMP/integration.rss")
          tests_total=$(jq -s '[.[] | select(.Action == "run" and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          tests_executed=$(jq -s '[.[] | select((.Action == "pass" or .Action == "fail") and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          tests_reused=$(jq -s '[.[] | select(.Action == "output" and ((.Output // "") | contains("(cached)")))] | length' "$RUNNER_TEMP/go-test.json")
          tests_failed=$(jq -s '[.[] | select(.Action == "fail" and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          tests_unknown=$(jq -s '[.[] | select(.Action == "skip" and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          jq \
            --argjson build_wall_ms "${{ steps.verify.outputs.build_wall_ms }}" --argjson build_rss "$build_rss" \
            --argjson vet_wall_ms "${{ steps.verify.outputs.vet_wall_ms }}" --argjson vet_rss "$vet_rss" \
            --argjson test_wall_ms "${{ steps.verify.outputs.test_wall_ms }}" --argjson test_rss "$test_rss" \
            --argjson conformance_wall_ms "$conformance_wall_ms" --argjson conformance_rss "$conformance_rss" \
            --argjson integration_wall_ms "$integration_wall_ms" --argjson integration_rss "$integration_rss" \
            --argjson tests_total "$tests_total" --argjson tests_executed "$tests_executed" --argjson tests_reused "$tests_reused" --argjson tests_failed "$tests_failed" --argjson tests_unknown "$tests_unknown" \
            '.runtime={build:{wall_ms:$build_wall_ms,peak_rss_kib:$build_rss},vet:{wall_ms:$vet_wall_ms,peak_rss_kib:$vet_rss},test:{wall_ms:$test_wall_ms,peak_rss_kib:$test_rss},conformance:{wall_ms:$conformance_wall_ms,peak_rss_kib:$conformance_rss},integration:{wall_ms:$integration_wall_ms,peak_rss_kib:$integration_rss}} | .tests={total:$tests_total,executed:$tests_executed,reused:$tests_reused,failed:$tests_failed,unknown:$tests_unknown}' \
            "$RUNNER_TEMP/synthesis-output/synthesis-manifest.json" > "$RUNNER_TEMP/synthesis-manifest.json"
          mv "$RUNNER_TEMP/synthesis-manifest.json" "$RUNNER_TEMP/synthesis-output/synthesis-manifest.json"
          jq -e '.decision == "REFUTED" and .counts.scenarios == 8 and .counts.closed == 3 and .counts.unknown == 3 and .counts.refuted == 2 and .counts.candidates_generated == 11 and .counts.candidates_executed == 9 and .counts.counterexamples == 2' "$RUNNER_TEMP/synthesis-output/synthesis-manifest.json" >/dev/null
      - name: Assemble release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          source="gooo-metamorphic-counterexample-synthesizer-$TAG.tar.gz"
          git archive --format=tar.gz --prefix="gooo-metamorphic-counterexample-synthesizer-$TAG/" "$EXPECTED_SHA" > "$release/$source"
          cp "$RUNNER_TEMP/synthesis-output/synthesis-manifest.json" "$release/synthesis-manifest.json"
          cp "$RUNNER_TEMP/synthesis-output/candidate-events.ndjson" "$release/candidate-events.ndjson"
          cp "$RUNNER_TEMP/synthesis-output/counterexample-receipt.json" "$release/counterexample-receipt.json"
          cp "$RUNNER_TEMP/synthesis-output/metamorphic-counterexample-report.md" "$release/metamorphic-counterexample-report.md"
          (cd "$release" && sha256sum "$source" synthesis-manifest.json candidate-events.ndjson counterexample-receipt.json metamorphic-counterexample-report.md > SHA256SUMS)
          jq -n \
            --arg tag "$TAG" --arg commit "$EXPECTED_SHA" \
            --arg source "$source" --arg source_digest "sha256:$(sha256sum "$release/$source" | awk '{print $1}')" --argjson source_size "$(stat -c '%s' "$release/$source")" \
            --arg manifest_digest "sha256:$(sha256sum "$release/synthesis-manifest.json" | awk '{print $1}')" --argjson manifest_size "$(stat -c '%s' "$release/synthesis-manifest.json")" \
            --arg events_digest "sha256:$(sha256sum "$release/candidate-events.ndjson" | awk '{print $1}')" --argjson events_size "$(stat -c '%s' "$release/candidate-events.ndjson")" \
            --arg receipt_digest "sha256:$(sha256sum "$release/counterexample-receipt.json" | awk '{print $1}')" --argjson receipt_size "$(stat -c '%s' "$release/counterexample-receipt.json")" \
            --arg report_digest "sha256:$(sha256sum "$release/metamorphic-counterexample-report.md" | awk '{print $1}')" --argjson report_size "$(stat -c '%s' "$release/metamorphic-counterexample-report.md")" \
            --arg sums_digest "sha256:$(sha256sum "$release/SHA256SUMS" | awk '{print $1}')" --argjson sums_size "$(stat -c '%s' "$release/SHA256SUMS")" \
            '{schema:"gooo/metamorphic-counterexample-synthesizer/release-manifest/v1",tag:$tag,commit:$commit,expected_asset_count:7,expected_asset_names:[$source,"synthesis-manifest.json","candidate-events.ndjson","counterexample-receipt.json","metamorphic-counterexample-report.md","SHA256SUMS","release-manifest-"+$tag+".json"],assets:[{name:$source,size:$source_size,digest:$source_digest},{name:"synthesis-manifest.json",size:$manifest_size,digest:$manifest_digest},{name:"candidate-events.ndjson",size:$events_size,digest:$events_digest},{name:"counterexample-receipt.json",size:$receipt_size,digest:$receipt_digest},{name:"metamorphic-counterexample-report.md",size:$report_size,digest:$report_digest},{name:"SHA256SUMS",size:$sums_size,digest:$sums_digest}]}' > "$release/release-manifest-$TAG.json"
          (cd "$release" && sha256sum -c SHA256SUMS)
      - name: Create draft, upload assets, and publish with GITHUB_TOKEN
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/release"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$EXPECTED_SHA" -m "gooo-metamorphic-counterexample-synthesizer $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --draft --verify-tag --title "Gooo Metamorphic Counterexample Synthesizer $TAG" --notes 'Immutable evidence-bounded metamorphic synthesis release.'
          gh release upload "$TAG" "$release"/*
          gh release edit "$TAG" --draft=false
      - name: Verify public immutable release and every asset digest
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/release"
          data=$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true' <<< "$data" >/dev/null
          ref=$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          test "$(jq -r '.object.type' <<< "$ref")" = "tag"
          tag_object_sha=$(jq -r '.object.sha' <<< "$ref")
          tag_object=$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          test "$(jq -r '.object.type' <<< "$tag_object")" = "commit"
          test "$(jq -r '.object.sha' <<< "$tag_object")" = "$EXPECTED_SHA"
          expected_manifest="$release/release-manifest-$TAG.json"
          expected_names=$(jq -c '.expected_asset_names' "$expected_manifest")
          actual_names=$(jq -c '[.assets[].name] | sort' <<< "$data")
          test "$actual_names" = "$(jq -c 'sort' <<< "$expected_names")"
          verify_dir="$RUNNER_TEMP/downloaded-assets"
          mkdir -p "$verify_dir"
          while IFS= read -r file; do
            name=$(basename "$file")
            local_size=$(stat -c '%s' "$file")
            local_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            asset=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<< "$data")
            test -n "$asset" && test "$asset" != "null"
            test "$(jq -r '.size' <<< "$asset")" = "$local_size"
            test "$(jq -r '.digest' <<< "$asset")" = "$local_digest"
            asset_id=$(jq -r '.id' <<< "$asset")
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$verify_dir/$name"
            test "$(stat -c '%s' "$verify_dir/$name")" = "$local_size"
            test "sha256:$(sha256sum "$verify_dir/$name" | awk '{print $1}')" = "$local_digest"
          done < <(find "$release" -maxdepth 1 -type f -print | sort)
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg tag "$TAG" --arg commit "$EXPECTED_SHA" --argjson release_id "$(jq '.id' <<< "$data")" --argjson assets "$(jq '[.assets[] | {id,name,size,digest}]' <<< "$data")" '{schema:"gooo/metamorphic-counterexample-synthesizer/release-audit/v1",repository:$repository,tag:$tag,target_commit:$commit,release_id:$release_id,immutable:true,assets:$assets}' > "$RUNNER_TEMP/release-audit.json"
          cat "$RUNNER_TEMP/release-audit.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: metamorphic-counterexample-synthesizer-${{ inputs.release_version }}-release-audit
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-audit.json
            ${{ runner.temp }}/release/*
