name: metamorphic-counterexample-synthesizer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: true
          cache: true
      - name: Bind declared toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Build runner
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/build.rss" go build -trimpath -o "$RUNNER_TEMP/gooo-synth" ./cmd/gooo-metamorphic-counterexample-synthesizer
          finished=$(date +%s%3N)
          echo "wall_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "RUNNER_DIGEST=sha256:$(sha256sum "$RUNNER_TEMP/gooo-synth" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"
      - name: Run vet
        id: vet
        shell: bash
        run: |
          set -Eeuo pipefail
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/vet.rss" go vet ./...
          finished=$(date +%s%3N)
          echo "wall_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
      - name: Run Go tests exactly once
        id: test
        shell: bash
        run: |
          set -Eeuo pipefail
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/test.rss" go test -json -count=1 ./... > "$RUNNER_TEMP/go-test.json"
          finished=$(date +%s%3N)
          echo "wall_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
      - name: Run metacode conformance
        id: conformance
        shell: bash
        run: |
          set -Eeuo pipefail
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/conformance.rss" "$RUNNER_TEMP/gooo-synth" conformance \
            --source .gooo/metamorphic-counterexample-synthesizer.gooo \
            --contract contracts/metamorphic-counterexample-synthesizer-v1.json \
            --fixtures fixtures/scenarios.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/conformance.json"
          finished=$(date +%s%3N)
          echo "wall_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
          jq -e '.status == "PASS" and .scenario_count == 8 and .activity_count == 7 and .authority.repository_writes == 0 and .authority.commit_authority == 0 and .authority.push_authority == 0 and .authority.merge_authority == 0 and .authority.release_authority == 0 and .authority.local_test_executions == 0' "$RUNNER_TEMP/conformance.json" >/dev/null
      - name: Run synthesis integration
        id: integration
        shell: bash
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/synthesis-output"
          mkdir -p "$output"
          started=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/integration.rss" bash scripts/run-synthesis.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gooo-synth" "$output"
          finished=$(date +%s%3N)
          wall_ms=$((finished - started))
          build_rss=$(cat "$RUNNER_TEMP/build.rss")
          vet_rss=$(cat "$RUNNER_TEMP/vet.rss")
          test_rss=$(cat "$RUNNER_TEMP/test.rss")
          conformance_rss=$(cat "$RUNNER_TEMP/conformance.rss")
          integration_rss=$(cat "$RUNNER_TEMP/integration.rss")
          tests_total=$(jq -s '[.[] | select(.Action == "run" and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          tests_executed=$(jq -s '[.[] | select((.Action == "pass" or .Action == "fail") and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          tests_reused=$(jq -s '[.[] | select(.Action == "output" and ((.Output // "") | contains("(cached)")))] | length' "$RUNNER_TEMP/go-test.json")
          tests_failed=$(jq -s '[.[] | select(.Action == "fail" and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          tests_unknown=$(jq -s '[.[] | select(.Action == "skip" and (.Test // "") != "")] | length' "$RUNNER_TEMP/go-test.json")
          jq \
            --argjson build_wall_ms "${{ steps.build.outputs.wall_ms }}" --argjson build_rss "$build_rss" \
            --argjson vet_wall_ms "${{ steps.vet.outputs.wall_ms }}" --argjson vet_rss "$vet_rss" \
            --argjson test_wall_ms "${{ steps.test.outputs.wall_ms }}" --argjson test_rss "$test_rss" \
            --argjson conformance_wall_ms "${{ steps.conformance.outputs.wall_ms }}" --argjson conformance_rss "$conformance_rss" \
            --argjson integration_wall_ms "$wall_ms" --argjson integration_rss "$integration_rss" \
            --argjson tests_total "$tests_total" --argjson tests_executed "$tests_executed" --argjson tests_reused "$tests_reused" --argjson tests_failed "$tests_failed" --argjson tests_unknown "$tests_unknown" \
            '.runtime={build:{wall_ms:$build_wall_ms,peak_rss_kib:$build_rss},vet:{wall_ms:$vet_wall_ms,peak_rss_kib:$vet_rss},test:{wall_ms:$test_wall_ms,peak_rss_kib:$test_rss},conformance:{wall_ms:$conformance_wall_ms,peak_rss_kib:$conformance_rss},integration:{wall_ms:$integration_wall_ms,peak_rss_kib:$integration_rss}} | .tests={total:$tests_total,executed:$tests_executed,reused:$tests_reused,failed:$tests_failed,unknown:$tests_unknown}' \
            "$output/synthesis-manifest.json" > "$RUNNER_TEMP/synthesis-manifest.json"
          mv "$RUNNER_TEMP/synthesis-manifest.json" "$output/synthesis-manifest.json"
          jq -e '
            .decision == "REFUTED" and .counts.scenarios == 8 and
            .counts.closed == 3 and .counts.unknown == 3 and .counts.refuted == 2 and
            .counts.candidates_generated == 11 and .counts.candidates_executed == 9 and .counts.counterexamples == 2 and
            ([.scenarios[] | select(.decision == "CLOSED" and .candidates_generated == .candidates_executed and .counterexamples == 0)] | length) == 3 and
            ([.scenarios[] | select(.decision == "UNKNOWN" and (.unknown.stage and .unknown.step and .unknown.reason and .unknown.unknown_class and .unknown.next_operation and (.unknown.blocked_by | length > 0)))] | length) == 3 and
            ([.scenarios[] | select(.decision == "REFUTED" and .first_counterexample.candidate_index == 1 and .first_counterexample.before_source != "" and .first_counterexample.after_source != "" and .first_counterexample.before_ir != "" and .first_counterexample.after_ir != "" and (.first_counterexample.before_trace | length) > 0 and (.first_counterexample.after_trace | length) > 0 and .first_counterexample.digest != "" and .first_counterexample.reproducible == true)] | length) == 2 and
            .authority.repository_writes == 0 and .authority.commit_authority == 0 and .authority.push_authority == 0 and .authority.merge_authority == 0 and .authority.release_authority == 0 and .authority.local_test_executions == 0 and .authority.caller_owned_output_only == true and
            .improvement.status == "UNKNOWN" and .improvement.matched_pair == false
          ' "$output/synthesis-manifest.json" >/dev/null
          test "$(git status --porcelain)" = ""
      - name: Publish exact CI summary
        shell: bash
        run: |
          {
            echo '## Metamorphic Counterexample Synthesizer'
            echo
            jq -r '"- decision: \(.decision)", "- scenarios: \(.counts.scenarios) (\(.counts.closed) CLOSED / \(.counts.unknown) UNKNOWN / \(.counts.refuted) REFUTED)", "- candidates generated / executed: \(.counts.candidates_generated) / \(.counts.candidates_executed)", "- counterexamples: \(.counts.counterexamples)", "- improvement: \(.improvement.status)"' "$RUNNER_TEMP/synthesis-output/synthesis-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: metamorphic-counterexample-synthesizer-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/synthesis-output/*
            ${{ runner.temp }}/conformance.json
            ${{ runner.temp }}/go-test.json
